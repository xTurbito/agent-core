name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Bateria offline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Misma version que el Dockerfile de produccion.
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/correr_bateria.py

  calidad:
    name: Lint y tipos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Informativo por ahora: main ya trae errores de ruff y mypy. Quitar esta
    # linea cuando ambos queden en cero para que empiecen a bloquear.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: mypy --config-file pyproject.toml core app main.py
